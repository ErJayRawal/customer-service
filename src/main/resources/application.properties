quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:customer_service}
quarkus.datasource.password=${DB_PASSWORD:customer_service}
quarkus.datasource.devservices.enabled=true

quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/orders}
quarkus.oidc.token.issuer=${OIDC_TOKEN_ISSUER:http://localhost:8180/realms/orders}
quarkus.oidc.token.audience=customer-service
quarkus.oidc.jwks-path=${OIDC_JWKS_PATH:/protocol/openid-connect/certs}
quarkus.oidc.token.principal-claim=sub
quarkus.oidc.token.subject-required=true
customer.identity.issuer=${OIDC_TOKEN_ISSUER:http://localhost:8180/realms/orders}

quarkus.http.auth.permission.customer-api.paths=/api/v1/customers/*
quarkus.http.auth.permission.customer-api.policy=authenticated

quarkus.smallrye-openapi.info-title=Customer Service API
quarkus.smallrye-openapi.info-version=1.0.0
%test.quarkus.oidc.enabled=false
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:customers;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.devservices.enabled=false
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL}