apiVersion: v1
kind: Service
metadata:
  name: customer-service
  labels:
    app.kubernetes.io/name: customer-service
    app.kubernetes.io/part-of: customer-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: customer-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  labels:
    app.kubernetes.io/name: customer-service
    app.kubernetes.io/part-of: customer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: customer-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customer-service
        app.kubernetes.io/part-of: customer-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 185
        runAsGroup: 185
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: customer-service
          image: customer-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_JDBC_URL
              value: jdbc:postgresql://customer-postgres.customer-service.svc.cluster.local:5432/customers
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: customer-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: customer-db-credentials
                  key: password
            - name: OIDC_AUTH_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: customer-service-config
                  key: oidc-auth-server-url
            - name: OIDC_TOKEN_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: customer-service-config
                  key: oidc-token-issuer
            - name: OIDC_JWKS_PATH
              valueFrom:
                configMapKeyRef:
                  name: customer-service-config
                  key: oidc-jwks-path
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
